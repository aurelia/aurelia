version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.0

# # # # # # # # # # # # # # # #
# - Scalar variables -
# # # # # # # # # # # # # # # #
scalar-1: &working_dir ~/repo

# # # # # # # # # # # # # # # #
# - Map variables -
# # # # # # # # # # # # # # # #
map-1: &filter_only_master
  filters:
    branches:
      only:
        - master
    tags:
      ignore: /.*/

map-2: &filter_only_topic
  filters:
    branches:
      ignore:
        - master
        - develop
        - release
    tags:
      ignore: /.*/

parameters:
  run_pr_full:
    type: boolean
    default: false
  run_bench:
    type: boolean
    default: false
  run_pr_lite:
    type: boolean
    default: true
  benchmark_profile:
    type: string
    default: ""
  benchmark_pr:
    type: string
    default: ""
  benchmark_base_sha:
    type: string
    default: ""
  benchmark_head_sha:
    type: string
    default: ""
  benchmark_candidate_sha:
    type: string
    default: ""

# # # # # # # # # # # # # # # #
# - Executors -
# # # # # # # # # # # # # # # #
executors:
  docker_circleci:
    parameters:
      node:
        type: string
        default: "22.12.0"
    working_directory: *working_dir
    resource_class: large
    docker:
      - image: "cimg/node:<< parameters.node >>-browsers"

  docker_circleci_bench:
    working_directory: *working_dir
    resource_class: large
    docker:
      - image: "cimg/node:22.12.0-browsers"

# # # # # # # # # # # # # # # #
# - Commands -
# # # # # # # # # # # # # # # #
commands:
  setup_verdaccio:
    parameters:
      email:
        type: string
        default: "aurelia@bluespire.com"
      username:
        type: string
        default: "aureliaeffect"
      password:
        type: string
        default: "aurelia"
      registry:
        type: string
        default: "http://localhost:4873"
    steps:
      - run: sudo npm i -g verdaccio npm-cli-login
      - run:
          name: "verdaccio"
          background: true
          command: verdaccio
      - run: npm-cli-login -u <<parameters.username>> -p <<parameters.password>> -e <<parameters.email>> -r <<parameters.registry>>

  checkout_install:
    parameters:
      install:
        type: boolean
        default: true
      install_drivers:
        type: boolean
        default: true
      install_chrome:
        type: boolean
        default: true
      install_firefox:
        type: boolean
        default: true
    steps:
      - checkout
      - when:
          condition:
            and:
              - <<parameters.install_drivers>>
              - <<parameters.install_chrome>>
          steps:
            - browser-tools/install_chrome
            - browser-tools/install_chromedriver
      - when:
          condition:
            and:
              - <<parameters.install_drivers>>
              - <<parameters.install_firefox>>
          steps:
            - browser-tools/install_firefox
            - browser-tools/install_geckodriver
      - when:
          condition: <<parameters.install>>
          steps:
            - run: npm ci

  checkout_install_build_bundle_publish_verdaccio:
    parameters:
      channel:
        type: string
      suffix:
        type: string
        default: ""
      registry:
        type: string
        default: "http://localhost:4873"
    steps:
      - checkout
      - restore_cache:
          key: cache-{{ checksum "package-lock.json" }}-install
      - restore_cache:
          name: "Restore build artifacts"
          key: cache-{{ .Revision }}-build-true
      - run: npm run generate-native-modules
      - run: npm run bump-version:<< parameters.channel >> -- << parameters.suffix >>
      - setup_verdaccio
      - run: npm config set registry << parameters.registry >>
      - run: npm run publish:<< parameters.channel >>

# # # # # # # # # # # # # # # #
# - Jobs -
# # # # # # # # # # # # # # # #
jobs:
  checkout_install_cache:
    executor: docker_circleci
    steps:
      - checkout
      - restore_cache:
          key: cache-{{ checksum "package-lock.json" }}-install
      - run: |
          # cache restored
          if [[ $(ls -l node_modules | grep -c ^d) -gt 10 ]]; then
            exit 0
          else
            npm ci
          fi
      - save_cache:
          key: cache-{{ checksum "package-lock.json" }}-install
          paths:
            - node_modules
            - packages/__tests__/node_modules

            - packages-tooling/__tests__/node_modules
            - packages-tooling/au/node_modules
            - packages-tooling/babel-jest/node_modules
            - packages-tooling/parcel-transformer/node_modules
            - packages-tooling/plugin-conventions/node_modules
            - packages-tooling/plugin-gulp/node_modules
            - packages-tooling/ts-jest/node_modules
            - packages-tooling/vite-plugin/node_modules
            - packages-tooling/webpack-loader/node_modules
            - packages/__e2e__/15-ts6-webpack-smoke/node_modules
            - packages/__e2e__/16-ts7-webpack-smoke/node_modules

  build_and_cache:
    executor: docker_circleci
    parameters:
      command:
        type: string
        default: npm run build
      release:
        type: boolean
        default: false
      generate_native_modules:
        type: boolean
        default: false
    steps:
      - checkout
      - restore_cache:
          key: cache-{{ checksum "package-lock.json" }}-install
      - when:
          condition:
            equal: [true, << parameters.release >>]
          steps:
            - run: npm run build:release
      - when:
          condition:
            equal: [false, << parameters.release >>]
          steps:
            - run: npm run build
      - when:
          condition:
            equal: [false, << parameters.release >>]
          steps:
            - run: << parameters.command >>
      - when:
          condition: << parameters.generate_native_modules >>
          steps:
            - run: npm run generate-native-modules
      - save_cache:
          key: cache-{{ .Revision }}-build-<< parameters.release >>
          paths:
            - packages/__tests__/dist
            - packages/addons/dist
            - packages/aurelia/dist
            - packages/compat-v1/dist
            - packages/dialog/dist
            - packages/fetch-client/dist
            - packages/i18n/dist
            - packages/kernel/dist
            - packages/metadata/dist
            - packages/platform/dist
            - packages/platform-browser/dist
            - packages/route-recognizer/dist
            - packages/router-direct/dist
            - packages/router/dist
            - packages/expression-parser/dist
            - packages/runtime/dist
            - packages/template-compiler/dist
            - packages/runtime-html/dist
            - packages/state/dist
            - packages/store-v1/dist
            - packages/testing/dist
            - packages/ui-virtualization/dist
            - packages/validation/dist
            - packages/validation-html/dist
            - packages/validation-i18n/dist
            - packages/web-components/dist

            - packages-tooling/__tests__/dist
            - packages-tooling/au/dist
            - packages-tooling/babel-jest/dist
            - packages-tooling/parcel-transformer/dist
            - packages-tooling/plugin-conventions/dist
            - packages-tooling/plugin-gulp/dist
            - packages-tooling/ts-jest/dist
            - packages-tooling/vite-plugin/dist
            - packages-tooling/webpack-loader/dist

  unit_test_esm:
    parameters:
      coverage:
        type: boolean
        default: true
      npm_command:
        type: string
        default: "test"
      install_chrome:
        type: boolean
        default: false
      install_firefox:
        type: boolean
        default: false
    executor: docker_circleci
    parallelism: 4
    steps:
      - checkout_install:
          install_chrome: <<parameters.install_chrome>>
          install_firefox: <<parameters.install_firefox>>
          install: false
      - restore_cache:
          key: cache-{{ checksum "package-lock.json" }}-install
      - restore_cache:
          key: cache-{{ .Revision }}-build-true
      - run:
          name: "Split test glob"
          command: |
            echo $(circleci tests glob "packages/__tests__/dist/**/*.spec.js" | circleci tests split --split-by=name)
            echo $(circleci tests glob "packages/__tests__/dist/**/*.spec.js" | circleci tests split --split-by=name) > packages/__tests__/tests.txt
      - run:
          name: "Run unit tests"
          command: |
            cd packages/__tests__
            npm run << parameters.npm_command >>
          no_output_timeout: "5m"
      - when:
          condition: << parameters.coverage >>
          steps:
            - run:
                name: "Process coverage for Codecov"
                command: |
                  node_modules/codecov/bin/codecov -f packages/__tests__/coverage/coverage-final.json

  unit_test_esm_node:
    executor: docker_circleci
    parallelism: 4
    steps:
      - checkout_install:
          install_chrome: false
          install_firefox: false
          install: false
      - restore_cache:
          name: "Restore dependencies"
          key: cache-{{ checksum "package-lock.json" }}-install
      - restore_cache:
          name: "Restore build artifacts"
          key: cache-{{ .Revision }}-build-true
      - run:
          name: "Split test glob"
          command: |
            cd packages/__tests__
            echo $(circleci tests glob "dist/**/*.spec.js" | circleci tests split --split-by=timings)
            echo $(circleci tests glob "dist/**/*.spec.js" | circleci tests split --split-by=timings) > tests.txt
      - run:
          name: "Run unit tests"
          command: |
            cd packages/__tests__
            npm run ::mocha -- $(cat tests.txt)
          no_output_timeout: "1m"

  unit_test_cjs:
    parameters:
      submodules:
        type: boolean
        default: false
    executor: docker_circleci
    parallelism: 10
    steps:
      - checkout_install:
          install_chrome: false
          install_firefox: false
          install: false
      - restore_cache:
          name: "Restore dependencies"
          key: cache-{{ checksum "package-lock.json" }}-install
      - restore_cache:
          name: "Restore build artifacts"
          key: cache-{{ .Revision }}-build-true
      - when:
          condition: << parameters.submodules >>
          steps:
            - run:
                name: "Pull Submodules"
                command: |
                  git submodule init
                  git submodule update --remote
      - run:
          name: "Split test glob"
          command: |
            cd packages-tooling/__tests__
            echo $(circleci tests glob "dist/**/*.spec.js" | circleci tests split --split-by=timings --timings-type=testname)
            echo $(circleci tests glob "dist/**/*.spec.js" | circleci tests split --split-by=timings --timings-type=testname) > tests.txt
      - run:
          name: "Run unit tests"
          command: |
            cd packages-tooling/__tests__
            npm run ::mocha -- $(cat tests.txt)
          no_output_timeout: "10m"

  lint_packages:
    executor: docker_circleci
    steps:
      - checkout_install:
          install_drivers: false
          install: false
      - restore_cache:
          name: "Restore dependencies"
          key: cache-{{ checksum "package-lock.json" }}-install
      - run:
          name: "Check internal dependency consistency"
          command: node scripts/check-internal-deps.cjs
      - run: npm run lint:ci
      - run: npm run lint:other:ci

  # e2e hmr
  e2e_test:
    executor: docker_circleci
    parameters:
      path:
        type: string
      run_webpack:
        type: boolean
        default: false
      run_prod:
        type: boolean
        default: false
    steps:
      - checkout_install:
          install_drivers: false
          install: false
      - restore_cache:
          name: "Restore dependencies"
          key: cache-{{ checksum "package-lock.json" }}-install
      - restore_cache:
          name: "Restore build artifacts"
          key: cache-{{ .Revision }}-build-true
      - run:
          name: "Run e2e script"
          working_directory: << parameters.path >>
          command: |
            npx playwright install chromium
            npm run test
          no_output_timeout: "1m"
      - when:
          condition: << parameters.run_webpack >>
          steps:
            - run:
                name: "Run e2e webpack"
                working_directory: << parameters.path >>
                command: |
                  npm run test:e2e:webpack
                no_output_timeout: "1m"
      - when:
          condition: << parameters.run_prod >>
          steps:
            - run:
                name: "Run e2e production build (webpack)"
                working_directory: << parameters.path >>
                command: |
                  npm run test:e2e:prod:webpack
                no_output_timeout: "2m"
            - run:
                name: "Run e2e production build (vite)"
                working_directory: << parameters.path >>
                command: |
                  npm run test:e2e:prod:vite
                no_output_timeout: "2m"

  # Standalone playwright test jobs
  e2e_verdaccio:
    executor: docker_circleci
    parameters:
      path:
        type: string
      suite:
        type: string
        default: "examples"
      use_verdaccio:
        type: boolean
        default: true
      registry:
        type: string
        default: "http://localhost:4873"
    steps:
      - checkout_install_build_bundle_publish_verdaccio:
          channel: dev
          suffix: "-${CIRCLE_BUILD_NUM}"
      - when:
          condition: << parameters.use_verdaccio >>
          steps:
            - run:
                name: "Install app via verdaccio"
                command: |
                  cd << parameters.path >>
                  npm i --registry << parameters.registry >>
      - unless:
          condition: << parameters.use_verdaccio >>
          steps:
            - run:
                name: "Install app via npm"
                command: |
                  cd << parameters.path >>
                  npm i
      - run:
          name: "Build test app"
          command: |
            npx rimraf --glob node_modules
            cd << parameters.path >>
            npm run test
          no_output_timeout: "30s"

  tacho_benchmark_prep:
    executor: docker_circleci_bench
    environment:
      BENCHMARK_REQUEST_PROFILE: << pipeline.parameters.benchmark_profile >>
      BENCHMARK_REQUEST_PR: << pipeline.parameters.benchmark_pr >>
      BENCHMARK_REQUEST_BASE_SHA: << pipeline.parameters.benchmark_base_sha >>
      BENCHMARK_REQUEST_HEAD_SHA: << pipeline.parameters.benchmark_head_sha >>
      BENCHMARK_REQUEST_CANDIDATE_SHA: << pipeline.parameters.benchmark_candidate_sha >>
    steps:
      - checkout
      - restore_cache:
          name: "Restore dependencies"
          key: cache-{{ checksum "package-lock.json" }}-install
      - run:
          name: "Verify benchmark revisions"
          command: |
            set -euo pipefail

            candidate=$(git rev-parse HEAD)
            if [[ -n "${BENCHMARK_REQUEST_PR}" ]]; then
              if [[ ! "${BENCHMARK_REQUEST_PR}" =~ ^[1-9][0-9]*$ ]]; then
                echo "Invalid benchmark PR number: ${BENCHMARK_REQUEST_PR}" >&2
                exit 1
              fi
              if [[ "${CIRCLE_BRANCH}" != "pull/${BENCHMARK_REQUEST_PR}/merge" ]]; then
                echo "Expected CircleCI merge ref pull/${BENCHMARK_REQUEST_PR}/merge, got ${CIRCLE_BRANCH}." >&2
                exit 1
              fi

              sha_pattern='^[0-9a-f]{40}$'
              for value in \
                "${BENCHMARK_REQUEST_BASE_SHA}" \
                "${BENCHMARK_REQUEST_HEAD_SHA}" \
                "${BENCHMARK_REQUEST_CANDIDATE_SHA}"; do
                if [[ ! "${value}" =~ ${sha_pattern} ]]; then
                  echo "Benchmark revisions must be full lowercase commit SHAs: ${value}" >&2
                  exit 1
                fi
              done
              if [[ "${candidate}" != "${BENCHMARK_REQUEST_CANDIDATE_SHA}" ]]; then
                echo "CircleCI checked out ${candidate}, expected ${BENCHMARK_REQUEST_CANDIDATE_SHA}." >&2
                exit 1
              fi

              read -r first_parent second_parent extra < <(git show -s --format=%P "${candidate}")
              if [[ -n "${extra:-}" \
                || "${first_parent:-}" != "${BENCHMARK_REQUEST_BASE_SHA}" \
                || "${second_parent:-}" != "${BENCHMARK_REQUEST_HEAD_SHA}" ]]; then
                echo "Candidate parents do not match the requested base and head." >&2
                exit 1
              fi

              base=${BENCHMARK_REQUEST_BASE_SHA}
              head=${BENCHMARK_REQUEST_HEAD_SHA}
              profile=${BENCHMARK_REQUEST_PROFILE}
              pr=${BENCHMARK_REQUEST_PR}
            elif [[ "${CIRCLE_BRANCH}" == "master" ]]; then
              read -r base _ < <(git show -s --format=%P "${candidate}")
              if [[ -z "${base:-}" ]]; then
                echo "The master benchmark requires a first-parent baseline." >&2
                exit 1
              fi
              head=''
              profile='master'
              pr=''
            else
              echo "Benchmark provenance is missing for branch ${CIRCLE_BRANCH}." >&2
              exit 1
            fi

            revisions=("${base}" "${candidate}")
            if [[ -n "${head}" ]]; then
              revisions+=("${head}")
            fi
            for revision in "${revisions[@]}"; do
              if ! git cat-file -e "${revision}^{commit}"; then
                git fetch --no-tags origin "${revision}"
              fi
            done

            {
              echo "export BENCHMARK_BASE_SHA=${base}"
              echo "export BENCHMARK_HEAD_SHA=${head}"
              echo "export BENCHMARK_CANDIDATE_SHA=${candidate}"
              echo "export BENCHMARK_PROFILE=${profile}"
              echo "export BENCHMARK_PR=${pr}"
            } >> "${BASH_ENV}"
      - run:
          name: "Validate benchmark harness"
          working_directory: "benchmarks"
          command: npm run bench:test
      - run:
          name: "Prepare exact benchmark variants"
          working_directory: "benchmarks"
          command: |
            set -euo pipefail
            args=(
              --base "${BENCHMARK_BASE_SHA}"
              --candidate "${BENCHMARK_CANDIDATE_SHA}"
              --output results/variants
              --profile "${BENCHMARK_PROFILE}"
            )
            if [[ -n "${BENCHMARK_PR}" ]]; then
              args+=(--head "${BENCHMARK_HEAD_SHA}" --pull-request "${BENCHMARK_PR}")
            fi
            npm run bench:variants -- "${args[@]}"
      - persist_to_workspace:
          root: .
          paths:
            - benchmarks/results/variants
      - store_artifacts:
          path: benchmarks/results/variants
          destination: benchmark-variants

  tacho_benchmark:
    executor: docker_circleci_bench
    parameters:
      command:
        type: string
      result:
        type: string
      no_output_timeout:
        type: string
        default: "30s"
    steps:
      - checkout
      - attach_workspace:
          at: .
      # Tachometer resolves the npm module; Circle installs the executable matched to this job's Chrome.
      - browser-tools/install_chrome
      - browser-tools/install_chromedriver
      - restore_cache:
          name: "Restore dependencies"
          key: cache-{{ checksum "package-lock.json" }}-install
      - run:
          name: "benchmark: <<parameters.command>>"
          command: |
            mkdir -p results
            <<parameters.command>>
          working_directory: "benchmarks"
          # Explicit-GC lifecycle samples do more work before Tachometer writes its result table.
          no_output_timeout: <<parameters.no_output_timeout>>
      - persist_to_workspace:
          root: .
          paths:
            - benchmarks/results/<<parameters.result>>
      - store_artifacts:
          path: benchmarks/results/<<parameters.result>>
          destination: benchmark-results/<<parameters.result>>

  benchmark_report:
    executor: docker_circleci_bench
    parameters:
      profile:
        type: string
    environment:
      BENCHMARK_REPORT_PROFILE: <<parameters.profile>>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: "Build benchmark report"
          working_directory: "benchmarks"
          command: npm run bench:report
      - store_artifacts:
          path: benchmarks/results/report
          destination: benchmark-report

  # on branches that only touches doc
  # there's no need to run the workflow
  check_doc_abort:
    executor: docker_circleci
    environment:
      COMMIT_RANGE: << pipeline.git.base_revision >>..<<pipeline.git.revision>>
    steps:
      - checkout
      - run: |
          # Extract commit range (or single commit)
          echo "commit range from CircleCI: ${COMMIT_RANGE}"

          if [[ -n ${CIRCLE_PR_NUMBER} ]]; then
            curl -L "https://github.com/stedolan/jq/releases/download/jq-1.5/jq-linux64" \
              -o jq
            chmod +x jq

            url="https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${CIRCLE_PR_NUMBER}"
            echo "Querying GitHub: $url"

            if [[ -n "${GITHUB_TOKEN}" ]]; then
              TARGET_BRANCH=$(curl -H "Authorization: token ${GITHUB_TOKEN}" -H "User-Agent: circleci" "${url}" | ./jq '.base.ref' | tr -d '"')
            else
              TARGET_BRANCH=$(curl -H "User-Agent: circleci" "${url}" | ./jq '.base.ref' | tr -d '"')
            fi

            echo "Target branch: ${TARGET_BRANCH}"
            COMMIT_RANGE="${CIRCLE_SHA1}..${TARGET_BRANCH}"
          fi

          echo "Normalized commit range: $COMMIT_RANGE"

          echo "File changed count: $(git diff --name-only $COMMIT_RANGE | grep -v '*' -c)"
          echo "Non doc file changes: $(git diff --name-only $COMMIT_RANGE | grep -v '^doc' -c)"

          if [[ $(git diff --name-only $COMMIT_RANGE | grep -v '*' -c) -gt 0 ]] && [[ $(git diff --name-only $COMMIT_RANGE | grep -v '^doc' -c) -eq 0 ]]; then
            echo "There is only doc work, cancelling workflow $CIRCLE_WORKFLOW_ID ..."
            curl --request POST \
              --url "https://circleci.com/api/v2/workflow/$CIRCLE_WORKFLOW_ID/cancel?circle-token=$CIRCLE_API_TOKEN"
          else
            echo "There are more than doc changes, running workflow $CIRCLE_WORKFLOW_ID..."
          fi

# # # # # # # # # # # # # # # #
# - Workflows -
# # # # # # # # # # # # # # # #
workflows:
  pr_lite:
    # Fast workflow for PR branches
    when: << pipeline.parameters.run_pr_lite >>
    jobs:
      - check_doc_abort:
          <<: *filter_only_topic
          name: pr_lite_check_doc

      - checkout_install_cache:
          <<: *filter_only_topic
          name: pr_lite_install
          requires:
            - pr_lite_check_doc

      - build_and_cache:
          <<: *filter_only_topic
          name: pr_lite_build
          release: true
          requires:
            - pr_lite_install

      - unit_test_esm:
          <<: *filter_only_topic
          name: pr_lite_test_esm
          npm_command: "test-chrome"
          install_chrome: true
          requires:
            - pr_lite_build

      - unit_test_esm_node:
          <<: *filter_only_topic
          name: pr_lite_test_node
          requires:
            - pr_lite_build

      - e2e_test:
          <<: *filter_only_topic
          name: pr_lite_e2e_smoke_vite
          path: "packages/__e2e__/1-gh-issues"
          requires:
            - pr_lite_build

  pr_full:
    when: << pipeline.parameters.run_pr_full >>
    jobs:
      - checkout_install_cache:
          <<: *filter_only_topic
          name: pr_full_install

      - build_and_cache:
          <<: *filter_only_topic
          name: pr_full_build_release
          release: true
          requires:
            - pr_full_install

      - unit_test_esm:
          <<: *filter_only_topic
          name: pr_full_test_chrome
          npm_command: "test-chrome"
          install_chrome: true
          requires:
            - pr_full_build_release

      - unit_test_esm_node:
          <<: *filter_only_topic
          name: pr_full_test_node
          requires:
            - pr_full_build_release

      - unit_test_cjs:
          <<: *filter_only_topic
          name: pr_full_test_toolings
          requires:
            - pr_full_build_release

      - e2e_test:
          <<: *filter_only_topic
          name: pr_full_e2e_hmr_vite
          path: "packages/__e2e__/2-hmr-vite"
          requires:
            - pr_full_build_release

      - e2e_test:
          <<: *filter_only_topic
          name: pr_full_e2e_vite8_decorators
          path: "packages/__e2e__/14-vite8-decorators"
          requires:
            - pr_full_build_release

      - e2e_test:
          <<: *filter_only_topic
          name: pr_full_e2e_router
          path: "packages/__e2e__/6-router"
          run_webpack: true
          run_prod: true
          requires:
            - pr_full_build_release

      - e2e_test:
          <<: *filter_only_topic
          name: pr_full_e2e_ts6_webpack_smoke
          path: "packages/__e2e__/15-ts6-webpack-smoke"
          requires:
            - pr_full_build_release

