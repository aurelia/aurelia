name: Trigger benchmarks on /ci bench

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number
        required: true
        type: number
      expected_base_sha:
        description: Optional full base SHA; fail if master has moved
        required: false
        type: string
      expected_head_sha:
        description: Optional full head SHA; fail if the PR has moved
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should: ${{ steps.command.outputs.should }}
      pr: ${{ steps.command.outputs.pr }}
    steps:
      - name: Decide whether to trigger benchmarks
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            const isMember = association =>
              ['MEMBER', 'OWNER', 'COLLABORATOR'].includes((association || '').toUpperCase());
            let should = false;
            let prNumber = '';

            if (context.eventName === 'issue_comment') {
              const isPR = Boolean(context.payload.issue?.pull_request);
              const body = (context.payload.comment?.body || '').trim();
              const association = context.payload.comment?.author_association || '';
              should = isPR && body === '/ci bench' && isMember(association);
              if (should) prNumber = String(context.issue.number);
            } else if (context.eventName === 'workflow_dispatch') {
              should = true;
              prNumber = String(context.payload.inputs?.pr_number || '');
            }

            core.setOutput('should', should ? 'true' : 'false');
            core.setOutput('pr', prNumber);

  trigger:
    needs: decide
    if: needs.decide.outputs.should == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Check out trusted workflow support
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Trigger and report CircleCI benchmark pipeline
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.decide.outputs.pr }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha || '' }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            const trigger = require('./.github/scripts/trigger-benchmark-pipeline.cjs');
            await trigger({
              github,
              context,
              core,
              prNumber: process.env.PR_NUMBER,
              profile: 'full',
              circleToken: process.env.CIRCLECI_TOKEN,
              expectedBase: process.env.EXPECTED_BASE_SHA,
              expectedHead: process.env.EXPECTED_HEAD_SHA,
            });
