<script type="module">
import {
  assertRealisticOpenEvent,
  assertRealisticRows,
  captureRealisticViewModels,
} from '../utils/assert-render.js';
import {
  createMixedRealisticRecords,
  createRealisticRecords,
} from '../utils/realistic-data.js';
import { loadVariant } from '../utils/load-variant.js';
import { publishMeasurement } from '../utils/publish-measurement.js';
const { CustomElement, start, tasksSettled } = await loadVariant('app-repeat-realistic');

const host = document.body.appendChild(document.createElement('div'));
const au = start(host, createRealisticRecords(1000));
const app = au.root.controller.viewModel;
const before = captureRealisticViewModels(host, app.items, CustomElement);
const nextItems = createMixedRealisticRecords(app.items);

performance.mark('realistic-mixed-start');
app.items = nextItems;
await tasksSettled();
performance.mark('realistic-mixed-end');

const usedJSHeapSizeBytes = performance.memory.usedJSHeapSize;
const after = assertRealisticRows(host, nextItems, CustomElement);
for (let id = 0; id < 1000; id++) {
  if (id % 10 === 0) {
    if (after.viewModels[id] !== undefined) throw new Error(`Mixed reconciliation retained removed row ${id}.`);
  } else if (after.viewModels[id] !== before[id]) {
    throw new Error(`Mixed reconciliation replaced retained row ${id}.`);
  }
}
for (let id = 1000; id < 1100; id++) {
  if (before[id] !== undefined || after.viewModels[id] === undefined) {
    throw new Error(`Mixed reconciliation did not create inserted row ${id}.`);
  }
}
assertRealisticOpenEvent(after.hosts[0], after.viewModels[nextItems[0].id]);
publishMeasurement(
  'realistic-mixed-1000',
  'realistic-mixed-start',
  'realistic-mixed-end',
  usedJSHeapSizeBytes,
);
</script>
