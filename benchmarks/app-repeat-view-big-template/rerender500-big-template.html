<script type="module">
import { assertSelectorCount } from '../utils/assert-render.js';
import { loadVariant } from '../utils/load-variant.js';
import { publishMeasurement } from '../utils/publish-measurement.js';
const { start, tasksSettled } = await loadVariant('app-repeat-view-big-template');

const host = document.body.appendChild(document.createElement('div'));
const au = await start(host);
assertSelectorCount(host, '[data-attr-0]', 0);

performance.mark('500-start');
au.root.controller.viewModel.newItems(500);
await tasksSettled();
performance.mark('500-end');

assertSelectorCount(host, '[data-attr-0]', 500);
publishMeasurement('rerender-500-big-template', '500-start', '500-end');
</script>
